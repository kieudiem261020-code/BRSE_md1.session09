<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="btvn2_s9.css">
</head>
<body>
    <!--header-->
    <header>
        <div class="logo">Lesson.</div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Courses</a>
            <a href="#">Pricing</a>
            <a href="#">Reviews</a>
        </nav>
        <button class="btn-black">Sign Up</button>
    </header>
    <section class="hero">
        <div class="hero-img">
            <img src="https://dongphuctanbinh.com/wp-content/uploads/2019/06/dong-phuc-hoi-dien-the-thao-mau-11-3936_HasThumb-400x600.jpg" alt="Student">
            <div class="float-box">
                <div><span class="material-symbols-outlined y">category</span><small> 25 Courses</small><b>UI/UX Design</b></div>
                <div><span class="material-symbols-outlined p">code</span><small> 25 Courses</small><b>Development</b></div>
                <div><span class="material-symbols-outlined r">campaign</span><small> 30 Courses</small><b>Marketing</b></div>
            </div>
        </div>
        <div class="hero-content">
            <button class="btn-yellow">See Courses</button>
            <div class="watch"><span class="material-symbols-outlined play">play_arrow</span>Watch Video</div>
        </div>
        <div class="stats">
            <p>Recent engagement</p>
            <div class="stat-row">
                <div><h2>50K</h2><span>Students</span></div>
                <div><h2>70+</h2><span>Courses</span></div>
            </div>
        </div>
    </section>
    <section class="courses">
        <div class="sec-title">
            <div><h2>Our popular courses</h2><p>Build new skills with new trendy courses and shune.</p></div>
            <div class="arrows"><button><span class="material-symbols-outlined">west</span></button><button class="act"><span class="material-symbols-outlined">east</span></button></div>
        </div>
        <div class="card-list">
            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500&q=80">
            <img src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500&q=80">
            <img src="https://images.unsplash.com/photo-1544165804606-c3d57bc86b40?w=500&q=80">
        </div>
    </section>
</body>
</html>
